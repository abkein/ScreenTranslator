name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build-test-package:
    name: Qt 6 build, tests, and AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake curl libfuse2t64 libhunspell-dev \
            libleptonica-dev libtesseract-dev libx11-dev libxcb1-dev \
            ninja-build pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qt5compat qtdeclarative qtpositioning qtwayland qtwebchannel qtwebengine
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DSCREEN_TRANSLATOR_BUILD_LEGACY=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Choose package name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version="$GITHUB_REF_NAME"
          else
            package_version="4.0.0-${GITHUB_SHA::7}"
          fi
          echo "PACKAGE_NAME=ScreenTranslator-${package_version}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build AppImage
        env:
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
          OUTPUT: ${{ env.PACKAGE_NAME }}
        run: |
          curl --fail --location --retry 3 --output linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 --output linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          test -f "$PACKAGE_NAME"

      - name: Smoke-test AppImage
        run: |
          chmod +x "$PACKAGE_NAME"
          QT_QPA_PLATFORM=offscreen "./$PACKAGE_NAME" --version

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTranslator-AppImage
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: github.ref_type == 'tag'
    needs: build-test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: ScreenTranslator-AppImage
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          package=$(find release -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$package"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" \
              --generate-notes --title "$GITHUB_REF_NAME"
          fi
